
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tablero de Puntos - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Tablero de Puntos</h1>

        <div class="card">
            <div class="card-body">

                <div class="row text-center">
                    <div class="col-5">
                        <span class="display-1" id="puntos-local">0</span>
                        <p class="m-0" id="nombre-local">Local</p>
                    </div>

                    <div class="col-2">
                        <span class="display-1">:</span>
                    </div>

                    <div class="col-5">
                        <span class="display-1" id="puntos-visitante">0</span>
                        <p class="m-0" id="nombre-visitante">Visitante</p>
                    </div>
                </div>

                <p id="estado-partido" class="text-center fw-bold mt-3">
                    Partido en juego
                </p>

                <hr class="hr">

                <h2>Actualizar Contador</h2>

                <div class="row">
                    <div class="col-12 col-sm-3 my-1">
                        <button id="sumar-local" class="btn d-block w-100 btn-primary">
                            + Punto Local
                        </button>
                    </div>

                    <div class="col-12 col-sm-3 my-1">
                        <button id="restar-local" class="btn d-block w-100 btn-secondary">
                            - Punto Local
                        </button>
                    </div>

                    <div class="col-12 col-sm-3 my-1">
                        <button id="sumar-visitante" class="btn d-block w-100 btn-primary">
                            + Punto Visitante
                        </button>
                    </div>

                    <div class="col-12 col-sm-3 my-1">
                        <button id="restar-visitante" class="btn d-block w-100 btn-secondary">
                            - Punto Visitante
                        </button>
                    </div>
                </div>

                <div class="row mt-2">
                    <div class="col-12 col-md-4 my-1">
                        <button id="invertir" class="btn btn-warning d-block w-100">
                            Invertir puntaje
                        </button>
                    </div>

                    <div class="col-12 col-md-4 my-1">
                        <button id="finalizar" class="btn btn-danger d-block w-100">
                            Finalizar partido
                        </button>
                    </div>

                    <div class="col-12 col-md-4 my-1">
                        <button id="reiniciar" class="btn btn-success d-block w-100">
                            Reiniciar tablero
                        </button>
                    </div>
                </div>

                <hr>

                <h2>Personalizar equipos</h2>

                <div class="row">
                    <div class="col-12 col-md-6 my-1">
                        <label for="input-local" class="form-label">Nombre del equipo local</label>
                        <input type="text" id="input-local" class="form-control" placeholder="Equipo local">
                    </div>

                    <div class="col-12 col-md-6 my-1">
                        <label for="input-visitante" class="form-label">Nombre del equipo visitante</label>
                        <input type="text" id="input-visitante" class="form-control" placeholder="Equipo visitante">
                    </div>
                </div>

                <button id="cambiar-nombres" class="btn btn-primary mt-2">
                    Cambiar nombres
                </button>

                <hr>

                <h2>Personalizar colores</h2>

                <div class="row">
                    <div class="col-12 col-md-4 my-1">
                        <label for="color-fondo" class="form-label">Color de fondo</label>
                        <input type="color" id="color-fondo" class="form-control form-control-color" value="#ffffff">
                    </div>

                    <div class="col-12 col-md-4 my-1">
                        <label for="color-local" class="form-label">Color equipo local</label>
                        <input type="color" id="color-local" class="form-control form-control-color" value="#0d6efd">
                    </div>

                    <div class="col-12 col-md-4 my-1">
                        <label for="color-visitante" class="form-label">Color equipo visitante</label>
                        <input type="color" id="color-visitante" class="form-control form-control-color" value="#dc3545">
                    </div>
                </div>

                <hr>

                <h2>Atajos de teclado</h2>
                <p>
                    A: sumar local | S: restar local<br>
                    K: sumar visitante | L: restar visitante<br>
                    R: reiniciar tablero
                </p>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>

    <script type="text/javascript">

        let puntosLocal = 0;
        let puntosVisitante = 0;
        let partidoFinalizado = false;

        const marcadorLocal = document.getElementById('puntos-local');
        const marcadorVisitante = document.getElementById('puntos-visitante');

        const botonesPuntaje = [
            document.getElementById('sumar-local'),
            document.getElementById('restar-local'),
            document.getElementById('sumar-visitante'),
            document.getElementById('restar-visitante')
        ];

        function actualizarTablero() {
            marcadorLocal.textContent = puntosLocal;
            marcadorVisitante.textContent = puntosVisitante;
        }

        function sumarLocal() {
            if (partidoFinalizado) return;

            puntosLocal++;
            actualizarTablero();
        }

     
        function restarLocal() {
            if (partidoFinalizado) return;

            if (puntosLocal > 0) {
                puntosLocal--;
                actualizarTablero();
            }
        }


        function sumarVisitante() {
            if (partidoFinalizado) return;

            puntosVisitante++;
            actualizarTablero();
        }

        function restarVisitante() {
            if (partidoFinalizado) return;

            if (puntosVisitante > 0) {
                puntosVisitante--;
                actualizarTablero();
            }
        }

        function invertirPuntaje() {
            if (partidoFinalizado) return;

            let auxiliar = puntosLocal;
            puntosLocal = puntosVisitante;
            puntosVisitante = auxiliar;

            actualizarTablero();
        }

    
        function finalizarPartido() {
            partidoFinalizado = true;

            botonesPuntaje.forEach(boton => {
                boton.disabled = true;
            });

            document.getElementById('estado-partido').textContent = 'Partido finalizado';
        }

       
        function reiniciarTablero() {
            puntosLocal = 0;
            puntosVisitante = 0;
            partidoFinalizado = false;

            botonesPuntaje.forEach(boton => {
                boton.disabled = false;
            });

            document.getElementById('estado-partido').textContent = 'Partido en juego';

            actualizarTablero();
        }

      
        function cambiarNombres() {
            const nombreLocal = document.getElementById('input-local').value.trim();
            const nombreVisitante = document.getElementById('input-visitante').value.trim();

            if (nombreLocal !== '') {
                document.getElementById('nombre-local').textContent = nombreLocal;
            }

            if (nombreVisitante !== '') {
                document.getElementById('nombre-visitante').textContent = nombreVisitante;
            }
        }

        function cambiarColores() {
            const colorFondo = document.getElementById('color-fondo').value;
            const colorLocal = document.getElementById('color-local').value;
            const colorVisitante = document.getElementById('color-visitante').value;

            document.body.style.backgroundColor = colorFondo;
            marcadorLocal.style.color = colorLocal;
            marcadorVisitante.style.color = colorVisitante;
        }

        document.getElementById('sumar-local').addEventListener('click', sumarLocal);
        document.getElementById('restar-local').addEventListener('click', restarLocal);
        document.getElementById('sumar-visitante').addEventListener('click', sumarVisitante);
        document.getElementById('restar-visitante').addEventListener('click', restarVisitante);

        document.getElementById('invertir').addEventListener('click', invertirPuntaje);
        document.getElementById('finalizar').addEventListener('click', finalizarPartido);
        document.getElementById('reiniciar').addEventListener('click', reiniciarTablero);

        document.getElementById('cambiar-nombres').addEventListener('click', cambiarNombres);

        document.getElementById('color-fondo').addEventListener('input', cambiarColores);
        document.getElementById('color-local').addEventListener('input', cambiarColores);
        document.getElementById('color-visitante').addEventListener('input', cambiarColores);

      
        document.addEventListener('keydown', function(e) {

            if (e.target.tagName === 'INPUT') return;

            switch (e.key.toLowerCase()) {
                case 'a':
                    sumarLocal();
                    break;

                case 's':
                    restarLocal();
                    break;

                case 'k':
                    sumarVisitante();
                    break;

                case 'l':
                    restarVisitante();
                    break;

                case 'r':
                    reiniciarTablero();
                    break;
            }
        });

      
        actualizarTablero();

    </script>
</body>
</html>

</html>
